<!DOCTYPE html>
<html lang="es">
<head><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00e5ff">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>J.A.R.V.I.S.</title>
<style>
/* ===== PERSONALIZA AQUÍ ===== */
:root {
  --fondo: #02080f;
  --panel: rgba(0, 40, 60, 0.55);
  --texto: #bff6ff;
  --acento: #00e5ff;
  --acento2: #ff9d00;
  --burbuja-yo: rgba(0, 229, 255, 0.12);
  --burbuja-ia: rgba(0, 60, 90, 0.45);
  --letra: "Orbitron", "Segoe UI", system-ui, sans-serif;
  --letra-chat: system-ui, sans-serif;
  --tam: 16px;
  --radio: 6px;
}
/* ============================ */
* { box-sizing: border-box; }
body {
  margin: 0; height: 100vh; display: flex; flex-direction: column;
  background:
    radial-gradient(circle at 50% 0%, #06314a 0%, var(--fondo) 60%),
    var(--fondo);
  color: var(--texto); font-family: var(--letra-chat); font-size: var(--tam);
  overflow: hidden;
}
body::before { /* cuadrícula HUD */
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(0,229,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,.05) 1px, transparent 1px);
  background-size: 40px 40px;
}
header {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; border-bottom: 1px solid var(--acento);
  background: var(--panel); box-shadow: 0 0 20px rgba(0,229,255,.25);
}
.titulo { font-family: var(--letra); letter-spacing: 6px; color: var(--acento);
  text-shadow: 0 0 10px var(--acento); font-size: 20px; }
#estado { font-family: var(--letra); font-size: 11px; letter-spacing: 3px; opacity: .8; }

/* ===== REACTOR ===== */
.reactor { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
.reactor div { position: absolute; border-radius: 50%; }
.r1 { inset: 0; border: 2px dashed var(--acento); animation: gira 14s linear infinite;
  box-shadow: 0 0 18px var(--acento); }
.r2 { inset: 10px; border: 3px solid transparent; border-top-color: var(--acento);
  border-bottom-color: var(--acento); animation: gira 5s linear infinite reverse; }
.r3 { inset: 22px; border: 2px solid var(--acento); opacity: .7; }
.r4 { inset: 32px; background: radial-gradient(circle, #fff 0%, var(--acento) 45%, transparent 75%);
  animation: late 2.4s ease-in-out infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@keyframes late { 50% { transform: scale(1.18); opacity: .75; } }
.reactor.escuchando .r1, .reactor.escuchando .r2, .reactor.escuchando .r3 {
  border-color: var(--acento2); box-shadow: 0 0 22px var(--acento2); }
.reactor.escuchando .r4 {
  background: radial-gradient(circle, #fff 0%, var(--acento2) 45%, transparent 75%);
  animation-duration: .6s; }
.reactor.pensando .r1 { animation-duration: 2s; }
.reactor.pensando .r2 { animation-duration: .8s; }
.reactor.hablando .r4 { animation-duration: .5s; }

/* ===== CHAT ===== */
#chat { position: relative; flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: var(--radio);
  white-space: pre-wrap; border: 1px solid rgba(0,229,255,.35); line-height: 1.4; }
.yo { align-self: flex-end; background: var(--burbuja-yo); border-right: 3px solid var(--acento); }
.ia { align-self: flex-start; background: var(--burbuja-ia); border-left: 3px solid var(--acento);
  box-shadow: 0 0 12px rgba(0,229,255,.12); }

/* ===== BARRA ===== */
#barra { position: relative; display: flex; gap: 8px; padding: 12px;
  border-top: 1px solid var(--acento); background: var(--panel); align-items: center; }
#entrada { flex: 1; padding: 12px; border-radius: var(--radio); border: 1px solid var(--acento);
  background: rgba(0,0,0,.4); color: var(--texto); font-size: var(--tam); outline: none; }
button { background: transparent; color: var(--acento); border: 1px solid var(--acento);
  border-radius: var(--radio); padding: 10px 16px; font-family: var(--letra);
  font-size: 13px; letter-spacing: 2px; text-shadow: 0 0 6px var(--acento); }
button:active { background: rgba(0,229,255,.25); }
#mic { width: 56px; height: 56px; border-radius: 50%; font-size: 24px; padding: 0;
  box-shadow: 0 0 14px var(--acento); }
#mic.activo { color: var(--acento2); border-color: var(--acento2);
  box-shadow: 0 0 22px var(--acento2); animation: late 1s infinite; }

/* ===== AJUSTES ===== */
#ajustes { display: none; position: relative; padding: 16px; background: rgba(0,20,35,.95);
  border-bottom: 1px solid var(--acento); max-height: 55vh; overflow-y: auto; }
#ajustes label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--acento); }
#ajustes input[type=text], #ajustes input[type=password], #ajustes textarea {
  width: 100%; padding: 10px; border-radius: var(--radio); border: 1px solid var(--acento);
  background: rgba(0,0,0,.5); color: var(--texto); font-size: 15px; }
#ajustes .fila { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
#ajustes button { margin: 12px 8px 0 0; }
</style>
</head>
<body>

<header>
  <div class="reactor" id="reactor">
    <div class="r1"></div><div class="r2"></div><div class="r3"></div><div class="r4"></div>
  </div>
  <div style="flex:1; padding-left:18px;">
    <div class="titulo">J.A.R.V.I.S.</div>
    <div id="estado">SISTEMA EN LÍNEA</div>
  </div>
  <button onclick="alternarAjustes()">AJUSTES</button>
</header>

<div id="ajustes">
  <label>Clave de Gemini</label>
  <input id="clave" type="password" placeholder="Pega tu API key">
  <label>Modelo</label>
  <input id="modelo" type="text" placeholder="gemini-3.8-flash">
  <label>Personalidad</label>
  <textarea id="sistema" rows="4"></textarea>
  <div class="fila">
    <input id="voz" type="checkbox">
    <span>Que JARVIS responda hablando</span>
  </div>
  <button onclick="guardarAjustes()">GUARDAR</button>
  <button onclick="borrarChat()" style="color:#ff6b6b;border-color:#ff6b6b">BORRAR CHAT</button>
  <button onclick="exportar()" style="color:#6bff9e;border-color:#6bff9e">EXPORTAR</button>
</div>

<div id="chat"></div>

<div id="barra">
  <button id="mic" onclick="micro()">🎤</button>
  <input id="entrada" placeholder="Escribe o toca el micrófono..."
    onkeydown="if(event.key==='Enter')enviar()">
  <button onclick="enviar()">ENVIAR</button>
</div>

<script>
const $ = id => document.getElementById(id);
let historial = [];
let ocupado = false;
let cfg = {
  clave: "",
  modelo: "gemini-3.8-flash",
  voz: true,
  sistema: "Eres J.A.R.V.I.S., el asistente de inteligencia artificial de tu usuario. " +
           "Responde siempre en español, con tono educado, eficiente y un toque de ingenio. " +
           "Sé breve y claro. Llama al usuario \"señor\"."
};

/* ---------- Estado visual ---------- */
function setEstado(est) {
  const textos = { reposo:"SISTEMA EN LÍNEA", escuchando:"ESCUCHANDO...",
                   pensando:"PROCESANDO...", hablando:"RESPONDIENDO..." };
  $("reactor").className = "reactor " + (est === "reposo" ? "" : est);
  $("estado").textContent = textos[est] || est;
  $("mic").classList.toggle("activo", est === "escuchando");
}

/* ---------- Carga y guardado ---------- */
function cargar() {
  try {
    historial = JSON.parse(localStorage.getItem("historial") || "[]");
    cfg = Object.assign(cfg, JSON.parse(localStorage.getItem("cfg") || "{}"));
  } catch (e) {}
  $("clave").value = cfg.clave;
  $("modelo").value = cfg.modelo;
  $("sistema").value = cfg.sistema;
  $("voz").checked = cfg.voz;
  historial.forEach(m => pintar(m.role === "user" ? "yo" : "ia", m.parts[0].text));
  if (!historial.length) pintar("ia", "Buenos días, señor. Todos los sistemas en línea. ¿En qué puedo ayudarle?");
}

function pintar(clase, texto) {
  const d = document.createElement("div");
  d.className = "msg " + clase;
  d.textContent = texto;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}

function alternarAjustes() {
  const a = $("ajustes");
  a.style.display = a.style.display === "block" ? "none" : "block";
}

function guardarAjustes() {
  cfg = { clave: $("clave").value.trim(), modelo: $("modelo").value.trim(),
          sistema: $("sistema").value, voz: $("voz").checked };
  try { localStorage.setItem("cfg", JSON.stringify(cfg)); } catch (e) {}
  alternarAjustes();
}

function borrarChat() {
  if (!confirm("¿Borrar todo el chat?")) return;
  historial = [];
  try { localStorage.removeItem("historial"); } catch (e) {}
  $("chat").innerHTML = "";
}

function exportar() {
  const txt = historial.map(m =>
    (m.role === "user" ? "Tú: " : "IA: ") + m.parts[0].text).join("\n\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain" }));
  a.download = "chat.txt";
  a.click();
}

/* ---------- Voz: escuchar ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, escuchando = false;

function micro() {
  if (!SR) { alert("Tu navegador no soporta reconocimiento de voz. Usa Chrome."); return; }
  if (escuchando) { rec.stop(); return; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  rec = new SR();
  rec.lang = "es-ES";
  rec.interimResults = true;
  rec.continuous = false;
  rec.onstart = () => { escuchando = true; setEstado("escuchando"); };
  rec.onresult = e => {
    let t = "";
    for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
    $("entrada").value = t;
    if (e.results[e.results.length - 1].isFinal) enviar();
  };
  rec.onerror = e => {
    escuchando = false;
    const msg = e.error === "not-allowed" ? "PERMISO DE MICRÓFONO DENEGADO"
              : e.error === "no-speech" ? "NO TE ESCUCHÉ" : "ERROR DE VOZ: " + e.error;
    $("estado").textContent = msg;
    $("mic").classList.remove("activo");
    $("reactor").className = "reactor";
  };
  rec.onend = () => {
    escuchando = false;
    if (!ocupado) setEstado("reposo");
  };
  try { rec.start(); } catch (e) {}
}

/* ---------- Voz: hablar ---------- */
function hablar(texto) {
  if (!cfg.voz || !window.speechSynthesis) { setEstado("reposo"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto.replace(/[*#`_]/g, ""));
  u.lang = "es-ES";
  u.onstart = () => setEstado("hablando");
  u.onend = () => setEstado("reposo");
  u.onerror = () => setEstado("reposo");
  speechSynthesis.speak(u);
}

/* ---------- Enviar a Gemini ---------- */
async function enviar() {
  const q = $("entrada").value.trim();
  if (!q || ocupado) return;
  if (!cfg.clave) { alert("Primero pega tu clave en AJUSTES"); return; }
  $("entrada").value = "";
  pintar("yo", q);
  historial.push({ role: "user", parts: [{ text: q }] });
  const espera = pintar("ia", "...");
  ocupado = true;
  setEstado("pensando");
  const ctrl = new AbortController();
  const tiempo = setTimeout(() => ctrl.abort(), 60000);
  let respuesta = null;
  try {
    const url = "https://generativelanguage.googleapis.com/v1beta/models/"
      + cfg.modelo + ":generateContent?key=" + encodeURIComponent(cfg.clave);
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({
        system_instruction: { parts: [{ text: cfg.sistema }] },
        contents: historial
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error?.message || "Error " + r.status);
    respuesta = data.candidates[0].content.parts.map(p => p.text || "").join("");
    espera.textContent = respuesta;
    historial.push({ role: "model", parts: [{ text: respuesta }] });
    try { localStorage.setItem("historial", JSON.stringify(historial)); } catch (e) {}
  } catch (e) {
    const msg = e.name === "AbortError" ? "Se agotó el tiempo de espera." : e.message;
    espera.textContent = "Error: " + msg;
    historial.pop();
  }
  clearTimeout(tiempo);
  ocupado = false;
  $("chat").scrollTop = $("chat").scrollHeight;
  if (respuesta) hablar(respuesta); else setEstado("reposo");
}

cargar();if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
setEstado("reposo");
</script>
</body>
</html>
